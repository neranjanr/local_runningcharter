<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Leave — 2026-01-16 (Friday)</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Forms & Container Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9ebff',
              200: '#bcdbff',
              500: '#0284c7',
              600: '#0070f3',
              700: '#005ed9',
            }
          }
        }
      }
    }
  </script>
<!-- Base Custom Styling -->
<style data-purpose="base-styling">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e2e8f0;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-900/40 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-100 selection:text-blue-900">
<!-- Modal Dialog -->
<!-- BEGIN: LeaveModalDialog -->
<div aria-labelledby="modal-headline" aria-modal="true" class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-slate-200/80 overflow-hidden transform transition-all duration-200 ease-out" data-purpose="apply-leave-modal" id="leave-modal-card" role="dialog">
<!-- Top Accent Bar -->
<div class="h-1.5 w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-sky-500"></div>
<div class="p-6 sm:p-7">
<!-- BEGIN: ModalHeader -->
<header class="flex items-start justify-between pb-4 border-b border-slate-100" data-purpose="modal-header">
<div class="space-y-1">
<h2 class="text-xl font-bold text-slate-900 tracking-tight" id="modal-headline">
          Leave — 2026-01-16 (Friday)
        </h2>
<p class="text-xs sm:text-sm text-slate-500 font-normal leading-relaxed">
          Add a note (max 200) and mark as leave. Tap a preset to fill the box, or type freely.
        </p>
</div>
<!-- Close Button -->
<button aria-label="Close modal" class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-1.5 rounded-lg transition-colors -mr-1 -mt-1" id="close-modal-btn" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: ModalHeader -->
<!-- BEGIN: ModalFormBody -->
<main class="py-5 space-y-5" data-purpose="modal-content-body">
<!-- Leave Type Presets Section (Option 2: Grouped by Category) -->
<section class="space-y-3.5" data-purpose="leave-category-selector">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
            Presets
          </label>
<span class="text-xs text-slate-400 font-medium">Click to fill</span>
</div>
<!-- Group 1: Standard Leave -->
<div class="space-y-1.5">
<div class="flex items-center gap-2">
<span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Standard Leave</span>
<div class="h-px flex-1 bg-slate-100"></div>
</div>
<div aria-label="Standard leave options" class="flex flex-wrap gap-2 text-xs font-medium" role="radiogroup">
<!-- Annual Leave (Active by default) -->
<button aria-checked="true" class="preset-chip group inline-flex items-center gap-1.5 px-3 py-2 rounded-xl transition-all border font-medium active-chip bg-blue-600 text-white border-blue-600 shadow-sm shadow-blue-500/20" data-leave-title="Annual Leave" role="radio" type="button">
<svg class="w-3.5 h-3.5 check-icon text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Annual Leave</span>
</button>
<!-- Casual Leave -->
<button aria-checked="false" class="preset-chip group inline-flex items-center gap-1.5 px-3 py-2 rounded-xl transition-all border font-medium inactive-chip bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200/90" data-leave-title="Casual Leave" role="radio" type="button">
<svg class="w-3.5 h-3.5 check-icon hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Casual Leave</span>
</button>
<!-- Medical Leave -->
<button aria-checked="false" class="preset-chip group inline-flex items-center gap-1.5 px-3 py-2 rounded-xl transition-all border font-medium inactive-chip bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200/90" data-leave-title="Medical Leave" role="radio" type="button">
<svg class="w-3.5 h-3.5 check-icon hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Medical Leave</span>
</button>
</div>
</div>
<!-- Group 2: Duty & Overseas -->
<div class="space-y-1.5">
<div class="flex items-center gap-2">
<span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Duty &amp; Overseas</span>
<div class="h-px flex-1 bg-slate-100"></div>
</div>
<div aria-label="Duty and overseas leave options" class="flex flex-wrap gap-2 text-xs font-medium" role="radiogroup">
<!-- Duty Leave -->
<button aria-checked="false" class="preset-chip group inline-flex items-center gap-1.5 px-3 py-2 rounded-xl transition-all border font-medium inactive-chip bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200/90" data-leave-title="Duty Leave" role="radio" type="button">
<svg class="w-3.5 h-3.5 check-icon hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Duty Leave</span>
</button>
<!-- Duty Leave (Overseas) -->
<button aria-checked="false" class="preset-chip group inline-flex items-center gap-1.5 px-3 py-2 rounded-xl transition-all border font-medium inactive-chip bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200/90" data-leave-title="Duty Leave (Overseas)" role="radio" type="button">
<svg class="w-3.5 h-3.5 check-icon hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Duty Leave (Overseas)</span>
</button>
<!-- Private Overseas -->
<button aria-checked="false" class="preset-chip group inline-flex items-center gap-1.5 px-3 py-2 rounded-xl transition-all border font-medium inactive-chip bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200/90" data-leave-title="Private Overseas" role="radio" type="button">
<svg class="w-3.5 h-3.5 check-icon hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Private Overseas</span>
</button>
</div>
</div>
</section>
<!-- Note / Reason Textarea Field -->
<section class="space-y-1.5" data-purpose="note-input-container">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider" for="leave-note-input">
            Note / Reason
          </label>
<span class="text-xs text-slate-400 font-medium tabular-nums" id="char-counter">
            12 / 200
          </span>
</div>
<div class="relative">
<textarea class="w-full px-3.5 py-2.5 bg-slate-50/60 hover:bg-slate-50 focus:bg-white text-sm text-slate-800 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all placeholder:text-slate-400 resize-none h-24 custom-scrollbar" id="leave-note-input" maxlength="200" placeholder="Enter note or select preset...">Annual Leave</textarea>
</div>
</section>
</main>
<!-- END: ModalFormBody -->
<!-- BEGIN: ModalActionsFooter -->
<footer class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3" data-purpose="modal-footer-buttons">
<button class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 bg-white hover:bg-slate-50 active:bg-slate-100 border border-slate-200 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300" id="cancel-btn" type="button">
          Cancel
        </button>
<button class="inline-flex items-center justify-center gap-2 px-5 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-xl shadow-md shadow-blue-500/25 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 hover:shadow-lg" id="submit-leave-btn" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Mark as Leave</span>
</button>
</footer>
<!-- END: ModalActionsFooter -->
</div>
</div>
<!-- END: LeaveModalDialog -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="interactive-behavior">
    document.addEventListener('DOMContentLoaded', () => {
      const noteInput = document.getElementById('leave-note-input');
      const charCounter = document.getElementById('char-counter');
      const chips = document.querySelectorAll('.preset-chip');
      const cancelBtn = document.getElementById('cancel-btn');
      const closeBtn = document.getElementById('close-modal-btn');
      const submitBtn = document.getElementById('submit-leave-btn');

      // Helper to activate a single chip by leave title or uncheck all
      const syncActiveChip = (text) => {
        let matched = false;
        chips.forEach(c => {
          const chipTitle = c.getAttribute('data-leave-title');
          const isMatch = (chipTitle === text.trim());
          if (isMatch && !matched) {
            matched = true;
            c.setAttribute('aria-checked', 'true');
            c.classList.remove('bg-slate-50', 'hover:bg-slate-100', 'text-slate-700', 'border-slate-200/90', 'inactive-chip');
            c.classList.add('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-sm', 'shadow-blue-500/20', 'active-chip');
            const icon = c.querySelector('.check-icon');
            if (icon) icon.classList.remove('hidden');
          } else {
            c.setAttribute('aria-checked', 'false');
            c.classList.remove('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-sm', 'shadow-blue-500/20', 'active-chip');
            c.classList.add('bg-slate-50', 'hover:bg-slate-100', 'text-slate-700', 'border-slate-200/90', 'inactive-chip');
            const icon = c.querySelector('.check-icon');
            if (icon) icon.classList.add('hidden');
          }
        });
      };

      // Update character counter and styles
      const updateCharCount = () => {
        const length = noteInput.value.length;
        charCounter.textContent = `${length} / 200`;
        if (length >= 190) {
          charCounter.classList.add('text-amber-500', 'font-semibold');
          charCounter.classList.remove('text-slate-400');
        } else {
          charCounter.classList.remove('text-amber-500', 'font-semibold');
          charCounter.classList.add('text-slate-400');
        }
      };

      // Preset Chip Click Event
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          const leaveTitle = chip.getAttribute('data-leave-title');
          noteInput.value = leaveTitle;
          updateCharCount();
          syncActiveChip(leaveTitle);
          noteInput.focus();
        });
      });

      // Typing in textarea updates counter and synchronizes active preset chip
      noteInput.addEventListener('input', () => {
        updateCharCount();
        syncActiveChip(noteInput.value);
      });

      // Initial character count calculation
      updateCharCount();

      // Submit feedback simulation
      submitBtn.addEventListener('click', () => {
        const originalContent = submitBtn.innerHTML;
        submitBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Marking...
        `;
        setTimeout(() => {
          submitBtn.innerHTML = `
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
            Marked as Leave
          `;
          submitBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
          submitBtn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');
        }, 500);
      });

      // Close / cancel handlers
      const handleClose = () => {
        const modal = document.getElementById('leave-modal-card');
        modal.classList.add('opacity-0', 'scale-95');
        setTimeout(() => {
          modal.classList.remove('opacity-0', 'scale-95');
        }, 300);
      };

      if (cancelBtn) cancelBtn.addEventListener('click', handleClose);
      if (closeBtn) closeBtn.addEventListener('click', handleClose);
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>
